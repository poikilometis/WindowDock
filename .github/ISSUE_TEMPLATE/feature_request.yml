name: Feature request
description: Describe a user problem and a proposed improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include affected platforms, alternatives, and examples where useful.
    validations:
      required: true