name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact product version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:alpha|beta|rc)\.(0|[1-9]\d*))?$' -or $env:RELEASE_TAG -ne "v$version") {
            throw 'The release tag must exactly match Directory.Build.props.'
          }
  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
  publish:
    name: Publish GitHub release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Verify assets and checksums
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          foreach ($suffix in @('win-x64', 'source')) {
            $asset = "WindowDock-$version-$suffix.zip"
            $path = Join-Path dist $asset
            $expected = (Get-Content "$path.sha256" -Raw).Trim().Split(' ')[0]
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Checksum mismatch: $asset" }
          }
          ./tools/Get-ReleaseNotes.ps1 -OutputPath ./artifacts/release-notes.md
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object Extension -in '.zip', '.sha256' | Select-Object -ExpandProperty FullName
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'A release already exists for this tag; published assets are immutable.' }
          $channel = @('--latest')
          if ($env:RELEASE_TAG.Contains('-')) { $channel = @('--prerelease', '--latest=false') }
          gh release create $env:RELEASE_TAG @files --verify-tag --notes-file ./artifacts/release-notes.md --title "WindowDock $env:RELEASE_TAG" @channel
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }